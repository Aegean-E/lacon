<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Lacon social preview</title>
  <desc id="desc">An AI that thinks in as few letters as possible, recursively over a long context. Everything is in this project: the alphabet, the budget, the thinker and the recursive engine. No network, no API key, no model weights. The core is standard library only; an optional adapter reads Pebble source when the sibling Pebble project is available (ADR-003).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1117"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.9"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g opacity="0.16" stroke="#f8fafc">
    <path d="M0 160h1280M0 320h1280M0 480h1280M256 0v640M512 0v640M768 0v640M1024 0v640"/>
  </g>
  <rect x="64" y="112" width="176" height="176" rx="42" fill="#0e1117" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="152" cy="200" r="58" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="2"/>
  <text x="152" y="224" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#60a5fa">LA</text>
  <text x="300" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc">Lacon</text>
  <text x="300" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" fill-opacity="0.78">An AI that thinks in as few letters as possible,</text><text x="300" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" fill-opacity="0.78">recursively over a long context. Everything is in</text><text x="300" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" fill-opacity="0.78">this project: the alphabet, the budget, the thinker</text>
  <text x="64" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#f8fafc" fill-opacity="0.55">AEGEANWORKS · LIBRARY</text>
  <text x="1216" y="560" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#60a5fa">github.com/AegeanWorks/Lacon</text>
