<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" data-motif="lens" data-layout="editorial">
  <title id="title">Lacon social preview</title>
  <desc id="desc">An AI that thinks in as few letters as possible, recursively over a long context. Everything is in this project: the alphabet, the budget, the thinker and the recursive engine. No network, no API key, no model weights. The core is standard library only; an optional adapter reads Pebble source when the sibling Pebble project is available (ADR-003).</desc>
