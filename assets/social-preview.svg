  <text x="80" y="378" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#F8FAFC" fill-opacity="0.74">An AI that thinks in as few letters as possible,</text><text x="80" y="420" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#F8FAFC" fill-opacity="0.74">recursively over a long context. Everything is in</text><text x="80" y="462" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#F8FAFC" fill-opacity="0.74">this project: the alphabet, the budget, the</text>
